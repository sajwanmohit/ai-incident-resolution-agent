spring:
  application:
    name: ai-incident-resolution-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:docker-model-runner}
      base-url: ${OPENAI_BASE_URL:http://localhost:12434/engines/v1}
      chat:
        completions-path: /chat/completions
        options:
          model: ${OPENAI_MODEL:docker.io/ai/qwen3:latest}
          temperature: ${OPENAI_TEMPERATURE:0.2}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:incident-resolution-group}
      auto-offset-reset: earliest
      enable-auto-commit: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  kafka:
    topic: ${KAFKA_TOPIC:incident-events}
    partitions: ${KAFKA_PARTITIONS:2}
    replication-factor: ${KAFKA_REPLICATION_FACTOR:2}
